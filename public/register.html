<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — Ludicrum</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>Ludicrum</h1>
        <p>Crie sua conta de organizador</p>
      </div>

      <div id="registerAlert" class="alert"></div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="name">Nome completo</label>
          <input type="text" id="name" class="form-control" placeholder="Seu nome" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar senha</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repita a senha" required>
        </div>

        <div class="form-group">
          <label>Escolha seu plano</label>
          <div id="planSelector" class="plan-selector"></div>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary btn-block btn-lg">Criar Conta</button>
      </form>

      <div class="auth-footer">
        Já tem uma conta? <a href="/login.html">Entrar</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
