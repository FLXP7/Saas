<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmissão — Ludicrum</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/watch.css">
</head>
<body>
  <div id="watchApp">
    <div id="authView" class="watch-auth-wrapper">
      <div class="watch-auth-card">
        <h2>🎬 Acessar Transmissão</h2>
        <p>Insira suas credenciais de acesso para assistir ao evento.</p>

        <div id="watchAlert" class="alert"></div>

        <form id="streamAuthForm">
          <div class="form-group">
            <label for="accessToken">Token de Acesso</label>
            <input type="text" id="accessToken" class="form-control" placeholder="Seu token de acesso" required>
          </div>

          <div class="form-group">
            <label for="accessEmail">Email cadastrado</label>
            <input type="email" id="accessEmail" class="form-control" placeholder="seu@email.com" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Acessar Transmissão</button>
        </form>
      </div>
    </div>

    <div id="playerView" class="watch-page hidden">
      <header class="watch-header">
        <span class="watch-logo">Ludicrum</span>
        <span class="watch-event-title" id="playerEventTitle">—</span>
        <div style="display:flex;align-items:center;gap:0.75rem">
          <span class="watch-live-badge">AO VIVO</span>
          <span class="watch-user" id="playerUserName">—</span>
        </div>
      </header>

      <div class="watch-container">
        <div class="watch-player" id="playerContainer"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/watch.js"></script>
</body>
</html>
